# This repository's documentation gate: spec check (ADR-0013, ADR-0022; docs/canon/spec-check-cli.md).
[project]
slug = "specengine-platform"   # names the index database of the read commands

[paths]
roots      = ["CLAUDE.md", "README.md", "crates", "docs", "plugin", "ui"]
records    = "docs/decisions"
tier0      = "CLAUDE.md"
tier1_name = "README.md"
index      = "docs/index.md"
exclude    = ["**/_*.md", "**/fixtures/**", "**/target/**", "**/target.noindex/**", "**/node_modules/**", "**/dist/**",
              # Skill bodies carry Claude Code's own front-matter (name, description), not a document class.
              "plugin/specengine/skills/*/SKILL.md"]

[ids]
ADR = { kind = "decision", width = 4 }

[budgets]
tier0_bytes    = 16384
tier1_bytes    = 10240
index_bytes    = 10240
decision_bytes = 1536
canon_bytes    = 12288

[classes]
canon     = { required = ["class", "tier", "scope", "owner", "reviewed"], closed = true }
decision  = { required = ["class", "id", "title", "status", "date", "scope"], optional = ["canon", "supersedes", "ref"], closed = true }
spec      = { required = ["class", "status", "scope"], optional = ["ref", "shipped", "adrs"], closed = true }
generated = { required = ["class", "generator", "source"], closed = true }

[check]
mode = "enforce"

# The project's process rules (ADR-0031; docs/canon/spec-check-process.md).
[[check.rules]]                     # decisions
kinds = ["decision"]
parts = ["Cost"]
text  = true

[[check.rules]]                     # shipped features
paths = ["docs/features/*.md"]
when  = { status = "shipped" }
parts = ["Implementation"]

[[generators]]
command = "cargo run -q -p specengine-cli -- export index"
writes  = ["docs/index.md", "docs/index-archive.md", "docs/index-decisions.md", "docs/index-crates.md"]
index   = true
gate    = "cargo run -q -p specengine-cli -- check"
# Live shards hold what is read by id (decisions) or by path (crate READMEs): docs/README.md "Generated".
shards  = [{ path = "docs/index-archive.md", tier3 = true },
           { path = "docs/index-decisions.md", claims = ["docs/decisions/*.md"] },
           { path = "docs/index-crates.md", claims = ["crates/*/README.md"] }]
