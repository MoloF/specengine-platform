# Fixture corpus card-press: an invented weekly print shop, no game word and
# no code. Two trades share one board: `copy` walks a text from draft to
# proof, a move out of `draft` being the desk's, and `plates` has no `moves`
# at all, so every ordered pair of its open columns stands. Its `blocked`
# column is a column like any other: nothing in the engine reads the word.
# Kinds, prefixes, flows and columns are this project's own
# (docs/features/card-store.md "Data", ADR-0008, ADR-0056). The five documents
# under PRN-WEEKLY are the brief of docs/features/card-trace.md: SHT-BACK uses
# SHT-FRONT-HEAD, and the accepted STY-0001, outside that tree, constrains
# SHT-FRONT, so a departure from it meets a dedup hit.

[project]
slug = "card-press"

[ids]
PRN = { kind = "print-run", shape = "name" }
SHT = { kind = "broadsheet", shape = "name" }
STY = { kind = "style-ruling", width = 4 }

[[card.flow]]
name = "copy"
disciplines = ["copy"]
columns = ["draft", "edit", "proof", "filed"]
accept = { from = "proof", to = "filed" }
moves = [
  { from = "draft", to = "edit", by = ["desk"] },
  { from = "edit", to = "proof" },
]

[[card.flow]]
name = "plates"
disciplines = ["plates"]
columns = ["queued", "blocked", "checked", "struck"]
accept = { from = "checked", to = "struck" }

[[workspace]]
name = "newsroom"
title = "Newsroom"
sections = ["board", "tree", "inbox"]
landing = "board"
flows = ["copy"]
module = "weekly"

[[workspace]]
name = "pressroom"
title = "Pressroom"
sections = ["board", "flow", "tree", "health"]
flows = ["plates"]

[[module]]
name = "weekly"
title = "The weekly run"
root = "PRN-WEEKLY"

[[module]]
name = "rulings"
title = "Style rulings"
root = "STY-0001"
