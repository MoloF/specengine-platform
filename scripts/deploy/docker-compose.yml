# A hub's whole host (docs/features/hub-deploy.md "The host"): seven services
# and nothing else. Traefik holds TLS, the routers and the door's forward-auth;
# Authelia the accounts and sessions; the daemon runs inside Traefik's network
# namespace on its loopback bind, its port never published (trust item 1);
# `admin` is the one-shot account acts (docs/features/hub-accounts.md), which
# `up -d` never starts. The three sidecars carry the hub's state off the host
# (docs/features/hub-ops.md "Compose"): `dump-queue` and `dump-door`, each on
# the image whose tool it runs and with no network, stage a generation every
# 15 minutes on the tmpfs volume hub-dumps; `backup`, on restic's image, the
# only one with a network, its own, sends them encrypted to the operator's
# backend and mounts no live data.
# Traefik's static configuration is its command list (S1); the dynamic one is
# traefik/dynamic/hub.yml. Pins: exact versions and index digests, pending the
# owner (Q7).
services:
  traefik:
    # Traefik v3.7.17, the multi-arch index (Docker Hub, 2026-11-03).
    image: traefik:v3.7.17@sha256:68ae5fe5b64ca166704b746a9e8afcd385e36b3f569a5691401bf652d57b3748
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {HUB_HOST: "${HUB_HOST}", DOOR_HOST: "${DOOR_HOST}"}
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=300s
      # An alias of a managed header (`Remote_User`) is refused, never passed on.
      - --entrypoints.websecure.http.aliasHeadersStrategy=reject
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/mcp-users:/etc/traefik/mcp-users:ro
      - traefik-acme:/acme
  authelia:
    # Authelia 4.39.28, the multi-arch index (Docker Hub, 2026-11-03).
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    restart: unless-stopped
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      HUB_DOMAIN: "${HUB_DOMAIN}"
      HUB_HOST: "${HUB_HOST}"
      DOOR_HOST: "${DOOR_HOST}"
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_key
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/authelia_jwt_secret
    secrets: [authelia_session_secret, authelia_storage_key, authelia_jwt_secret]
    volumes:
      - ./authelia/config:/config:ro
      - ./authelia/users:/users:ro      # hub-admin is the only writer (Q4)
      - authelia-data:/var/lib/authelia
  specengine:
    image: ghcr.io/molof/specengine:${SPECENGINE_VERSION:?set SPECENGINE_VERSION in .env}
    restart: unless-stopped
    # The daemon installs no signal handler: the init reaps the git children a
    # sync's deadline kills.
    init: true
    network_mode: "service:traefik"
    depends_on:
      traefik: {condition: service_started, restart: true}
    environment:
      HUB_HOST: "${HUB_HOST}"
      SPECENGINE_PUSH: "${SPECENGINE_PUSH}"
      GIT_SSH_COMMAND: ssh -i /run/secrets/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=/run/secrets/known_hosts -o StrictHostKeyChecking=yes
    secrets: [deploy_key, known_hosts]
    volumes:
      - ./projects:/projects
      - specengine-data:/data
    # specengine-health (scripts/deploy/health.sh): a loopback GET / answered
    # 403 by the fence, and websecure's port open in this namespace. Docker
    # restarts no unhealthy container: `unhealthy` is the operator's signal.
    healthcheck:
      test: ["CMD", "specengine-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  admin:
    # The account acts (docs/canon/hub-deploy.md "Accounts"): one-shot, run as
    # `docker compose run --rm admin <act>` on the host's terminal; no network.
    # Authelia 4.39.28, the authelia service's image byte for byte: its CLI.
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    profiles: [admin]
    network_mode: none
    logging: {driver: none}         # no password, secret or code reaches a log driver (R6)
    # The door image's own healthcheck probes a door server this service never runs.
    healthcheck: {disable: true}
    entrypoint: ["/bin/sh", "/opt/hub-admin/hub-admin"]
    environment:
      HUB_HOST: "${HUB_HOST}"
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_key
    secrets: [authelia_storage_key]
    volumes:
      - ./admin:/opt/hub-admin:ro
      - ./admin-log:/var/lib/hub-admin
      - ./authelia/users:/users
      - ./traefik/mcp-users:/mcp-users
      - ./traefik/dynamic:/traefik-dynamic
      - authelia-data:/var/lib/authelia
  dump-queue:
    # The hub's image byte for byte: `spec export state` of every served
    # project. /data is read-write because a reader of a WAL database maps its
    # -shm file; it writes nothing else there (R2).
    image: ghcr.io/molof/specengine:${SPECENGINE_VERSION:?set SPECENGINE_VERSION in .env}
    restart: unless-stopped
    init: true
    network_mode: none
    entrypoint: ["/bin/sh", "/opt/hub-ops/hub-ops"]
    command: ["queue"]
    volumes:
      - ./ops:/opt/hub-ops:ro
      - ./projects:/projects:ro
      - specengine-data:/data
      - hub-dumps:/dumps
  dump-door:
    # The authelia service's image byte for byte: `hub-admin dump` under the
    # act lock, the door's passkey and TOTP exports through its CLI.
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    restart: unless-stopped
    init: true
    network_mode: none
    entrypoint: ["/bin/sh", "/opt/hub-ops/hub-ops"]
    command: ["door"]
    # The door image's own healthcheck probes a door server this service never runs.
    healthcheck: {disable: true}
    environment:
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_key
    secrets: [authelia_storage_key]
    volumes:
      - ./ops:/opt/hub-ops:ro
      - ./admin:/opt/hub-admin:ro
      - ./admin-log:/var/lib/hub-admin
      - ./authelia/users:/users:ro
      - ./traefik/mcp-users:/mcp-users:ro
      - authelia-data:/var/lib/authelia
      - hub-dumps:/dumps
  backup:
    # restic 0.19.1, the multi-arch index (Docker Hub, 2026-11-04). It reads
    # the dumps read-only and holds the only network of the three; its
    # healthcheck is a whole upload round within 35 minutes.
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    restart: unless-stopped
    init: true
    hostname: hub-backup          # restic's lock host: a stale lock is its own after a restart
    networks: [backup]
    entrypoint: ["/bin/sh", "/opt/hub-ops/hub-ops"]
    command: ["upload"]
    environment:
      HUB_HOST: "${HUB_HOST}"
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      RESTIC_CACHE_DIR: /cache
    secrets: [restic_password, restic_env]
    tmpfs: [/snapshot, /state]
    volumes:
      - ./ops:/opt/hub-ops:ro
      - hub-dumps:/dumps:ro
      - restic-cache:/cache
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/hub-ops/hub-ops", "fresh"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 20m
networks:
  # backup's alone: nothing else joins it (R7).
  backup: {}
secrets:
  deploy_key: {file: ./secrets/deploy_key}
  known_hosts: {file: ./secrets/known_hosts}
  authelia_session_secret: {file: ./secrets/authelia_session_secret}
  authelia_storage_key: {file: ./secrets/authelia_storage_key}
  authelia_jwt_secret: {file: ./secrets/authelia_jwt_secret}
  # backup's alone: the repository password, and the backend's location and
  # keys, read line by line by hub-ops, never sourced.
  restic_password: {file: ./secrets/restic_password}
  restic_env: {file: ./secrets/restic_env}
volumes:
  specengine-data: {}
  authelia-data: {}
  traefik-acme: {}
  # The dumps' staging: tmpfs, so no dump touches the host's disk (R4).
  hub-dumps: {driver: local, driver_opts: {type: tmpfs, device: tmpfs, o: "size=256m,uid=10001,mode=0700"}}
  restic-cache: {}
