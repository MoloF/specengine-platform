# The gamedev preset (docs/features/workspaces.md "The gamedev preset"): six
# card flows and five workspaces for a game studio's trades. Copy it into a
# project's specengine.toml, add the project's own [[module]] tables and a
# workspace's `module`, and retitle anything in the project's language.
# Every name is data: no SpecEngine code reads one (ADR-0008, ADR-0073).
# A flow's title and return, and a [[card.split]] row, need a build that reads
# them on every terminal, plugin and hub serving the project, an older one
# refusing the key.

[[card.flow]]
name = "narrative"
title = "Narrative"
disciplines = ["narrative"]
columns = ["backlog", "sent-back", "outline", "draft", "review", "approved", "ready-for-dev", "in-game"]
titles = { backlog = "Backlog", sent-back = "Returned", outline = "Outline", draft = "Draft", review = "Review", approved = "Approved", ready-for-dev = "Ready for dev", in-game = "In game" }
accept = { from = "ready-for-dev", to = "in-game" }
return = "sent-back"

[[card.flow]]
name = "development"
title = "Programming"
disciplines = ["development"]
columns = ["backlog", "sent-back", "ready", "in-progress", "in-review", "verify", "done"]
titles = { backlog = "Backlog", sent-back = "Returned", ready = "Ready", in-progress = "In progress", in-review = "In review", verify = "Verify", done = "Done" }
accept = { from = "verify", to = "done" }
return = "sent-back"

[[card.flow]]
name = "art"
title = "Art"
disciplines = ["art"]
columns = ["waiting", "sent-back", "ready", "in-progress", "pending-review", "approved", "in-engine"]
titles = { waiting = "Waiting", sent-back = "Returned", ready = "Ready", in-progress = "In progress", pending-review = "Pending review", approved = "Approved", in-engine = "In engine" }
accept = { from = "approved", to = "in-engine" }
return = "sent-back"

[[card.flow]]
name = "level-design"
title = "Level design"
disciplines = ["level-design"]
columns = ["layout", "sent-back", "blockout", "playtest", "scripting", "lighting", "art-pass", "final"]
titles = { layout = "Layout", sent-back = "Returned", blockout = "Blockout", playtest = "Playtest", scripting = "Scripting", lighting = "Lighting", art-pass = "Art pass", final = "Final" }
accept = { from = "art-pass", to = "final" }
return = "sent-back"

[[card.flow]]
name = "production"
title = "Production"
disciplines = ["production"]
columns = ["to-do", "sent-back", "in-progress", "review", "done"]
titles = { to-do = "To do", sent-back = "Returned", in-progress = "In progress", review = "Review", done = "Done" }
accept = { from = "review", to = "done" }
return = "sent-back"

[[card.flow]]
name = "sound"
title = "Sound"
disciplines = ["sound"]
columns = ["backlog", "sent-back", "design", "recording", "implementation", "review", "in-game"]
titles = { backlog = "Backlog", sent-back = "Returned", design = "Sound design", recording = "Recording", implementation = "Implementation", review = "Review", in-game = "In game" }
accept = { from = "review", to = "in-game" }
return = "sent-back"

[[workspace]]
name = "writing"
title = "Writing"
sections = ["flow", "tree", "board", "questions", "inbox"]
landing = "flow"
flows = ["narrative"]

[[workspace]]
name = "development"
title = "Development"
sections = ["board", "inbox", "tree", "flow", "graph", "health", "roadmap", "questions"]
landing = "board"
flows = ["development"]

[[workspace]]
name = "art"
title = "Art and levels"
sections = ["board", "flow", "tree", "questions", "inbox"]
landing = "board"
flows = ["art", "level-design"]

[[workspace]]
name = "sound"
title = "Sound"
sections = ["board", "flow", "tree", "questions", "inbox"]
landing = "board"
flows = ["sound"]

[[workspace]]
name = "production"
title = "Production"
sections = ["inbox", "roadmap", "board", "flow", "tree", "graph", "health", "questions"]

# A direction: a module chosen by node kind, with no root. The Spec tree lists
# its kinds' nodes and a document's Inside groups them under its title; Flow,
# which draws from a root, leaves it out. Use your project's own kinds, and add
# it only once every terminal, plugin and hub runs a build that reads `kinds`.
# [[module]]
# name = "scenes"
# title = "Scenes"
# kinds = ["scene"]

# A split template: a task on a document of this kind, or holding nodes of
# it, pre-selects these disciplines in the Split dialog, and each subtask
# targets the nodes of its kinds. It never refuses a split. Use your project's
# own kinds, and add it only once every terminal, plugin and hub runs a build
# that reads `[[card.split]]`.
# [[card.split]]
# kind = "character"
# disciplines = ["narrative", "art", "sound"]
#
# [[card.split]]
# kind = "scene"
# disciplines = ["narrative", "level-design", "sound", "development"]
