[package]
name = "specengine-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The daemon's read surface of SpecEngine: the CLI's documents and the queue's live events over HTTP on 127.0.0.1"
# std only (docs/features/ui-embed.md "Data"): reruns when `ui/dist` changes and
# warns when it holds no `index.html`; no build dependency, no feature.
build = "src/build.rs"

[[bin]]
name = "specengine-http"
path = "src/main.rs"

# Every read goes through the `spec` library (`specengine-cli`), never the
# store or `rusqlite` directly; the reverse edge is forbidden (CLI_FORBIDDEN in
# crates/specengine-eval/tests/build_graph.rs). `tokio`'s `net` is the listener
# (`axum`'s `tokio` feature asks for it too); `sync` the per-project turn
# (`tokio::sync::Mutex`, awaited by the request's own task). `rust-embed`
# compiles `ui/dist` in (docs/features/ui-embed.md "Data"), plain: its features
# are the workspace pin's.
[dependencies]
specengine-cli = { path = "../specengine-cli" }
axum.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
futures-util.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rust-embed.workspace = true
# A hub's `/mcp/<slug>` (docs/features/hub-mcp.md S3, S4): rmcp's Streamable HTTP
# Tower service, its feature declared here alone, so the root pin and
# `specengine-mcp`'s manifest stay stdio-only. `specengine-mcp` holds the hub
# server and its `HubSeam`; `src/mcp.rs` is the one module naming either.
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
specengine-mcp = { path = "../specengine-mcp" }

# `regex` reads the proxy's step-up rule out of `docs/canon/hub.md` for a unit
# test of `src/hub.rs` (docs/features/hub-confirm.md B11); already in the graph.
[dev-dependencies]
regex.workspace = true
# `serde-saphyr` reads the deployment's YAML (`scripts/deploy/`, `image.yml`) and
# `toml` the root `Cargo.toml`'s `rust-version` for `tests/deploy.rs`
# (docs/features/hub-deploy.md D1-D15); both already in the graph through core.
serde-saphyr.workspace = true
toml.workspace = true
