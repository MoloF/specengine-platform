[package]
name = "specengine-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The `spec` command line of SpecEngine: init, index, search and show over the project's spec index; check and export index over a fresh parse"

# `spec`, installed with `cargo install --path crates/specengine-cli`.
[[bin]]
name = "spec"
path = "src/main.rs"

# On `specengine-{model,core,store,code}` only: never `specengine-{import,mcp,eval,ra}`,
# never `rusqlite` directly (the store owns the database; no `rusqlite` type
# crosses its API). Every command lives in the library (`src/lib.rs`), the
# reuse contract of MCP stdio and the Phase 2 daemon bridge.
[dependencies]
specengine-model = { path = "../specengine-model" }
specengine-core = { path = "../specengine-core" }
specengine-store = { path = "../specengine-store" }
# Layer A for `spec refs` and `spec lock accept`: Rust comment binding,
# RON anchors, `qpath`, the item hash (docs/canon/code-bindings.md).
specengine-code = { path = "../specengine-code" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# A package's `[package] name` in `spec refs`' code walk; already in the
# graph at this pin through `specengine-core`.
toml.workspace = true
# `spec verify --tests`' runner (Unix): `killpg`, `sigaction`, `waitid`
# (task spec `verify-tests`, "Runner"); plain, as a target table is banned.
libc.workspace = true
