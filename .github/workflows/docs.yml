# The only documentation check, §11 of docs/canon/documentation-system.md: spec check,
# configured by the root specengine.toml, over the checkout (HEAD).
name: docs
on:
  push:
  pull_request:
jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --locked -q -p specengine-cli -- check --root .
